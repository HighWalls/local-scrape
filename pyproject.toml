[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_scrape*"]
exclude = ["tests*"]

[project]
name = "local-scrape"
version = "0.1.0"
description = "Self-hosted scraping REST API and CLI with Ollama AI"
readme = "README.md"
authors = [{name = "HighWalls"}]
license = {file = "LICENSE"}
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5", "markdownify>=0.13,<2", "playwright>=1.48,<2",
  "pypdf>=5,<7", "jsonschema>=4.23,<5", "ddgs>=9,<10", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
local-scrape = "local_scrape.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
